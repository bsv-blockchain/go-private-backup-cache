name: go
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backup_cache_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build ./...
      - run: go vet ./...
      - name: Test (memory + postgres)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/backup_cache_test?sslmode=disable
        run: go test ./... -race -cover
      # v8 installs golangci-lint v2. v6 pins the v1 line, whose newest build
      # (1.64.8) is compiled with go1.24 and refuses to load a config for a module
      # targeting a newer Go: "the Go language version (go1.24) used to build
      # golangci-lint is lower than the targeted Go version (1.26.0)". That has
      # failed this job on every push since go.mod moved to 1.26.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
