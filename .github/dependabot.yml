# ────────────────────────────────────────────────────────────────
# Dependabot Configuration
#
# Purpose:
#   • Keep Go modules, npm packages, Docker base images, GitHub Actions, and the
#     devcontainer updated with the latest security patches and features.
#   • Reduce attack surface by limiting outdated dependencies.
#   • Minimise PR noise via smart grouping and sane pull‑request limits.
#
# References:
#   https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#   https://docs.github.com/en/code-security/dependabot/configuration-options-for-dependency-updates
#
# Security Hardened Defaults:
#   • Weekly cadence (Tuesday 11:00 America/New_York) – align with typical maintenance windows.
#   • Direct dependencies only – prevents unsolicited transitive churn.
#   • PRs labeled, assigned, and target the protected main branch.
#   • PR titles prefixed with chore(scope): – conventional commits.
#   • Force‑push and delete‑branch disabled via branch‑protection rules.
#   • PR limit = 10 to avoid queue flooding.
#   • All dependency PRs require passing CI checks before merging.
# ────────────────────────────────────────────────────────────────

version: 2

updates:
  # ──────────────────────────────────────────────────────────────
  # 1. Go Modules (go.mod / go.sum)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:00"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      gomod-all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "gomod"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ──────────────────────────────────────────────────────────────
  # 2. GitHub Actions Workflows
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:15"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      ghactions-all:
        patterns: ["*"]
    open-pull-requests-limit: 10
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "github-actions"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ──────────────────────────────────────────────────────────────
  # 3. DevContainer (devcontainer.json : base image + features)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:30"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      devcontainer-all:
        patterns: ["*"]
    open-pull-requests-limit: 5
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "devcontainer"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ──────────────────────────────────────────────────────────────
  # 4. npm (TypeScript client + cross-language interop suite)
  #
  #    ts-client/ and test-client/ are one npm workspace rooted at
  #    "/", with one lockfile, so every bump lands in both at once.
  #    @bsv/auth peers on @bsv/sdk, so the @bsv packages share a
  #    group that includes majors: an sdk major arrives together
  #    with the auth release that accepts it, never alone.
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:45"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    ignore:
      # The workspace's own client: always linked from ts-client/, never the registry.
      - dependency-name: "@bsv/backup-cache-client"
    groups:
      bsv:
        applies-to: version-updates
        patterns: ["@bsv/*"]
      npm-all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "npm"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ──────────────────────────────────────────────────────────────
  # 5. Docker (Dockerfile base images)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "12:00"
      timezone: "America/New_York"
    groups:
      docker-all:
        patterns: ["*"]
    open-pull-requests-limit: 5
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "docker"]
    commit-message:
      prefix: "chore"
      include: "scope"
